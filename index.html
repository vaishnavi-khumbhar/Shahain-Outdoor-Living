    <!-- Single Page Apps for GitHub Pages: restores the real route
         after 404.html redirects here with the path encoded in the
         query string. Must run before main.jsx so React Router sees
         the correct URL when it mounts. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
